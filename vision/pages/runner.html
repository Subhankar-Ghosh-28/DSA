<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/style.css" />
    <link rel="stylesheet" href="../styles/runner-page.css" />
    <title>DSA code runner</title>
  </head>
  <body class="runner-page">
    <header class="runner-header">
      <a class="back-link" href="index.html">← Back to sheet</a>
      <div><span class="section-kicker">LOCAL C++ WORKBENCH</span><h1>Run any solution.</h1><p>Choose a file from the full sheet, inspect the code, and test it without changing the repository.</p></div>
      <span class="runner-status"><i></i> Local runner</span>
    </header>
    <main class="runner-main">
      <div class="runner-toolbar runner-selectbar">
        <label class="runner-file-search"><span>⌕</span><input id="runnerSearch" type="search" placeholder="Search any source file..." aria-label="Search source files" /></label>
        <select id="runnerFileSelect" aria-label="Choose a source file"><option>Loading files...</option></select>
        <button id="runCodeButton" class="run-button" type="button">▶ Run code</button>
      </div>
      <div class="runner-workspace-grid">
        <section class="runner-editor-panel"><div class="panel-label">SOURCE CODE <span id="selectedPath">No file selected</span></div><textarea id="codeEditor" spellcheck="false" aria-label="Source code editor" placeholder="Choose a file to load its code..."></textarea></section>
        <section class="runner-output-panel"><div class="output-heading"><span>OUTPUT</span><button id="clearOutput" type="button">Clear</button></div><pre id="runnerOutput">Select a file, then press Run.</pre></section>
      </div>
    </main>
    <script src="../scripts/runner-page.js"></script>
  </body>
</html>
